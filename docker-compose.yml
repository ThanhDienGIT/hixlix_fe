version: '3.8'

services:
  # 1. Dịch vụ Frontend (ReactJS)
  frontend:
    container_name: hixlix_frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    networks:
      - hixlix_network
    restart: always

  # 2. Dịch vụ Backend (Laravel PHP-FPM)
  backend:
    container_name: hixlix_backend
    build:
      context: ./BE/hix_lix_BE
      dockerfile: Dockerfile.backend
    volumes:
      - ./BE/hix_lix_BE:/var/www
    networks:
      - hixlix_network
    restart: always

  # 3. Web Server Nginx trung gian để chạy Laravel Backend
  backend_nginx:
    image: nginx:alpine
    container_name: hixlix_backend_nginx
    ports:
      - "8000:80"
    volumes:
      - ./BE/hix_lix_BE:/var/www
      - ./BE/hix_lix_BE/docker-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - hixlix_network
    restart: always

networks:
  hixlix_network:
    driver: bridge